<div class="container">
    <app-header></app-header>
   <div>
    <p-scrollPanel [style]="{ width: '100%', height: '85%' }">
        <h1>Planes disponibles</h1>   
        <p-carousel [value]="products" [numVisible]="4" [numScroll]="1" [responsiveOptions]="responsiveOptions">
            <ng-template let-product pTemplate="item">
            <div class="product-item">
                <p-card [header]="product.planType" >
                <ng-template pTemplate="header">
                    <img alt="Card" [src]="'../../../../../assets/'+(product.planType | planImage)" height="230" style="object-fit: cover;" />
                </ng-template>
                <p>{{ product.planDescription }}</p>                
                <ng-template pTemplate="footer">
                    <h5>Desde: $ {{ product.discountedPrice  }}</h5>
                    <p-button label="Solicitar plan" [rounded]="true" size="small" (click)="onButtonClick(product.planType)"></p-button>            
                </ng-template>
                    </p-card>

            </div>
            </ng-template>
        </p-carousel>
    </p-scrollPanel>   
   </div>
         
    <app-footer></app-footer>
   
    
</div>

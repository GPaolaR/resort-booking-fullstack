<div class="container">
    <p-toast></p-toast> 
   <div>
        <h1>Agenda especialista</h1> 
        <div class="filter">
            <h2 class="mb-3">Filtros</h2>
            <div class="flex justify-content-start gap-5">                
                <span class="p-float-label">
                    <p-dropdown [options]="specialists" [(ngModel)]="selectedSpecialist" optionLabel="specialistFullName" placeholder="Seleccione un especialista"></p-dropdown>
                    <label for="float-label">Especialista</label>
                </span>  
                <span class="p-float-label">
                    <p-calendar  [(ngModel)]="dateAppointment" [showIcon]="true" placeholder="Seleccione una fecha"></p-calendar>
                    <label for="float-label">Fecha</label>
                </span>
            </div>
            <p-button [rounded]="true"  size="small" (onClick)="search()">Buscar</p-button>
        </div>  
        <div class="product-list">
            <div *ngFor="let appointment of appointments" class="product-item">
                <div class="card">
                    <h5>{{ appointment.planType }}</h5>
                    <div class="flex align-items-center justify-content-between">
                      <div>
                        <p>Tratamiento: {{ appointment.specialityName }}</p>
                        <p>Especialista(s): {{ appointment.specialistName }}</p>
                      </div>
                      <div>
                        <p>
                          Fecha y Hora: {{ appointment.appointmentDate | dateFormat }}
                        </p>
                        <h5>
                          Total a pagar: {{ appointment.totalPrice | currencyFormat }}
                        </h5>
                      </div>
                    </div>
                </div>
            </div>
        </div>
   </div>  
    
</div>

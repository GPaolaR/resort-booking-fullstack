<div class="container">    
   <div>
    <!-- <p-scrollPanel [style]="{ width: '100%', height: '85%' }"> -->
        <h1>Agenda general</h1> 
        <div class="filter">
            <h2 class="mb-3">Filtros</h2>
            <div class="flex justify-content-start gap-5 w-full"> 
                <span class="p-float-label">
                    <p-dropdown [options]="specialists" [(ngModel)]="selectedSpecialist" optionLabel="specialistFullName" placeholder="Seleccione un especialista"></p-dropdown>
                    <label for="float-label">Especialista</label>
                </span>               
                <span class="p-float-label">
                    <p-dropdown [options]="users" [(ngModel)]="selectedUser" optionLabel="userFullName" placeholder="Seleccione un usuario"></p-dropdown>
                    <label for="float-label">Usuario</label>
                </span>
                <span class="p-float-label">
                    <p-dropdown [options]="plans" [(ngModel)]="selectedPlan" optionLabel="planType" placeholder="Seleccione un plan"></p-dropdown>
                    <label for="float-label">Plan</label>
                </span>
                <span class="p-float-label">
                    <p-calendar  [(ngModel)]="inicialDate" [maxDate]="endDate"[showIcon]="true" placeholder="Seleccione una fecha inicio"></p-calendar>
                    <label for="float-label">Fecha inicio</label>
                </span>
                <span class="p-float-label">
                    <p-calendar  [(ngModel)]="endDate" [minDate]="inicialDate"[showIcon]="true" placeholder="Seleccione una fecha fin"></p-calendar>
                    <label for="float-label">Fecha fin</label>
                </span>
            </div>
            <p-button [rounded]="true"  size="small">Buscar</p-button>
        </div>  
        <div>
            
            <!-- [value]="customers" -->
            <p-table
            [paginator]="true"
            [rows]="5"
            [showCurrentPageReport]="true"
            [tableStyle]="{ 'min-width': '50rem' }"
            currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
            [rowsPerPageOptions]="[10, 25, 50]"
            >
            <ng-template pTemplate="header">
                <tr>
                    <th>Especialista</th>
                    <th>Usuario</th>
                    <th>Membresia</th>
                    <th>Plan</th>
                    <th>Tratamiento</th>
                    <th>Fecha</th>
                    <th>Hotal</th>
                    <th>Estado</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-customer>
                <!-- <tr>
                    <td>{{ customer.name }}</td>
                    <td>{{ customer.country.name }}</td>
                    <td>{{ customer.company }}</td>
                    <td>{{ customer.representative.name }}</td>
                </tr> -->
            </ng-template>
            <!-- <ng-template pTemplate="paginatorleft">
                <p-button type="button" icon="pi pi-plus" styleClass="p-button-text"></p-button>
            </ng-template>
            <ng-template pTemplate="paginatorright">
                <p-button type="button" icon="pi pi-cloud" styleClass="p-button-text"></p-button>
            </ng-template> -->
            </p-table>
        </div>
    <!-- </p-scrollPanel>    -->
   </div>    
</div>


<section class="background_login">
    <div class="cover">
        <div class="container">
            <h1>Spa Belleza</h1>
            
            <p>Disfruta de una experiencia única en nuestro Spa Belleza con los mejores especialistas </p>
            <p-divider type="solid" >
                <div class="inline-flex align-items-center">
                    <i class="pi pi-user mr-2"></i>
                    <b> Sumérgete en tu experiencia Spa Belleza</b>
                </div>
            </p-divider>
            <section class="login">
                
                <span class="p-float-label">
                    <input style="width: 273px;" pInputText placeholder="Usuario" id="username" required [(ngModel)]="credentialUser.USERNAME"/>
                    <label htmlFor="username">Usuario</label>
                </span>
                <span class="p-float-label justify-content-center">
                    <p-password placeholder="Contraseña" [toggleMask]="true" [feedback]="false" [(ngModel)]="credentialUser.PASSWORD_ENCRYPTED"></p-password>
                    <label for="password">Contraseña</label>
                </span>
                <p-button
                    label="Inicia sesión"
                    styleClass="p-button-rounded p-button-outlined"
                    (click)="btLogin()"
                ></p-button>
            </section>
        </div>
    </div>
</section>

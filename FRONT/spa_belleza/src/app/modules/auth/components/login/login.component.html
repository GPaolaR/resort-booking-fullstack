
<section class="background_login">
    <div class="cover">   
        <p-toast></p-toast> 
        <div class="container">
            <h1>Spa Belleza</h1>            
            <p>Disfruta de una experiencia única en nuestro Spa Belleza con los mejores especialistas </p>
            <p-divider type="solid" >
                <div class="inline-flex align-items-center">
                    <i class="pi pi-user mr-2"></i>
                    <b> Sumérgete en tu experiencia Spa Belleza</b>
                </div>
            </p-divider>
            <form [formGroup]="credentialUser" (ngSubmit)="btLogin()" novalidate class="login">
                
                <span class="p-float-label">
                    <input style="width: 273px;" pInputText placeholder="Usuario" id="username" formControlName="username"/>
                    <label htmlFor="username">Usuario</label>
                    <small class="p-error block" *ngIf="
                    credentialUser.get('username')?.invalid && credentialUser.get('username')?.dirty"> Nombre de usuario requerido</small>
                </span>
                <span class="p-float-label justify-content-center">
                    <p-password placeholder="Contraseña" [toggleMask]="true" [feedback]="false" formControlName="password"></p-password>
                    <label for="password">Contraseña</label>
                    <small class="p-error block" *ngIf="
                    credentialUser.get('password')?.invalid && credentialUser.get('password')?.dirty"> Contraseña requerida</small>
                </span>
                <p-button
                    type="submit" 
                    label="Inicia sesión"
                    styleClass="p-button-rounded p-button-outlined"
                    [disabled]="credentialUser.invalid"
                ></p-button>
            </form>
        </div>
    </div>
</section>

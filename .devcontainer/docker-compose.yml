services:
  app:
    image: mcr.microsoft.com/devcontainers/java:1-17-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    # Share the database's network so the API reaches Oracle at localhost:1521,
    # exactly like the default values in application.properties
    network_mode: service:db
    environment:
      DB_URL: jdbc:oracle:thin:@//localhost:1521/XEPDB1
      DB_USERNAME: GEST_SPA
      DB_PASSWORD: dev_password
      NG_CLI_ANALYTICS: "false"

  db:
    image: gvenzl/oracle-xe:21-slim-faststart
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: dev_system_password
      DB_PASSWORD: dev_password
    volumes:
      - ../database:/database:ro
      - ../database/docker/initdb:/container-entrypoint-initdb.d:ro

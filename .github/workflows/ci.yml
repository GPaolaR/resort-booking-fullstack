name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend (Angular build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NG_CLI_ANALYTICS: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx ng build

  backend:
    name: Database + Backend (Oracle XE, Spring Boot tests)
    runs-on: ubuntu-latest
    env:
      ORACLE_PASSWORD: ci_system_pw
      DB_PASSWORD: ci_app_pw
      DB_USERNAME: GEST_SPA
      DB_URL: jdbc:oracle:thin:@//localhost:1521/XEPDB1
    steps:
      - uses: actions/checkout@v5

      - name: Start Oracle XE
        run: |
          docker run -d --name oracle -p 1521:1521 \
            -e ORACLE_PASSWORD \
            -v "${{ github.workspace }}/database:/database:ro" \
            gvenzl/oracle-xe:21-slim-faststart
          for i in $(seq 1 60); do
            if docker logs oracle 2>&1 | grep -q "DATABASE IS READY TO USE"; then
              echo "Oracle is ready"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' oracle)" != "true" ]; then
              echo "Oracle container stopped"
              break
            fi
            echo "Waiting for Oracle... ($i)"
            sleep 5
          done
          docker logs oracle
          exit 1

      - name: Create GEST_SPA schema and sample data
        run: docker exec -e ORACLE_PASSWORD -e DB_PASSWORD oracle bash /database/docker/setup_gest_spa.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build and test backend (Hibernate validates entities against the schema)
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
